name: Build NAZA Road Scanner

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  analyze:
    name: Analyze Dart and Flutter sources
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev build-essential git binutils python3

      - name: Prepare Linux native runtime before tests
        run: |
          ./tool/prepare_linux_llamadart_native.sh
          ./tool/prepare_linux_liboqs.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application sources
        run: flutter analyze lib test

      - name: Run widget smoke test
        run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: analyze
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android App Bundle and APK
            os: ubuntu-latest
            platform: android
            build_command: flutter build appbundle --release && flutter build apk --release
            artifact: |
              build/app/outputs/bundle/release/app-release.aab
              build/app/outputs/flutter-apk/app-release.apk
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            build_command: flutter build linux --release
            artifact: build/linux/x64/release/bundle
          - name: Windows x64
            os: windows-latest
            platform: windows
            build_command: flutter build windows --release
            artifact: build/windows/x64/runner/Release
          - name: macOS
            os: macos-latest
            platform: macos
            build_command: flutter build macos --release
            artifact: build/macos/Build/Products/Release
          - name: iOS unsigned
            os: macos-latest
            platform: ios
            build_command: flutter build ios --release --no-codesign
            artifact: build/ios/iphoneos/Runner.app

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev build-essential git binutils python3

      - name: Prepare Crostini-compatible Linux runtime
        if: matrix.platform == 'linux'
        run: |
          ./tool/prepare_linux_llamadart_native.sh
          ./tool/prepare_linux_liboqs.sh

      - name: Set up Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate missing Flutter platform host
        shell: bash
        run: |
          flutter create --no-pub \
            --platforms=${{ matrix.platform }} \
            --project-name=roadscanner \
            --org=com.qroadscan .

      - name: Verify Android package name
        if: matrix.platform == 'android'
        shell: bash
        run: |
          grep -q 'com.qroadscan.roadscanner' android/app/build.gradle.kts
          if grep -q 'com.naza\|naza_llamadart_gui' android/app/build.gradle.kts; then
            echo 'Unexpected old Android package name found' >&2
            exit 1
          fi

      - name: Enable Android HTTPS model downloads
        if: matrix.platform == 'android'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          source = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in source:
              source, count = re.subn(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n' + permission,
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not locate the Android manifest root")
              path.write_text(source)
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Configure Android release signing
        if: matrix.platform == 'android'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::Android signing secrets are not configured; using Flutter's debug signing for this CI artifact."
            exit 0
          fi
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          : "${ANDROID_STORE_PASSWORD:?ANDROID_STORE_PASSWORD is required}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/naza-upload-key.jks
          keytool -list -keystore android/app/naza-upload-key.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          printf '%s\n' \
            "storePassword=$ANDROID_STORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=naza-upload-key.jks" > android/key.properties

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          source = path.read_text()
          if "keystorePropertiesFile" not in source:
              source = '''import java.io.FileInputStream
          import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          ''' + source
              source = source.replace(
                  "    buildTypes {",
                  '''    signingConfigs {
                  if (keystorePropertiesFile.exists()) {
                      create("release") {
                          keyAlias = keystoreProperties["keyAlias"] as String
                          keyPassword = keystoreProperties["keyPassword"] as String
                          storeFile = file(keystoreProperties["storeFile"] as String)
                          storePassword = keystoreProperties["storePassword"] as String
                      }
                  }
              }

              buildTypes {''',
                  1,
              )
              source = source.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = if (keystorePropertiesFile.exists()) signingConfigs.getByName("release") else signingConfigs.getByName("debug")',
                  1,
              )
              path.write_text(source)
          PY

          grep -q 'signingConfigs' android/app/build.gradle.kts

      - name: Select native runtime source
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" != "linux" ]]; then
            # The checked-in local bundle is required for Debian/Crostini
            # GLIBC compatibility. Other targets use LlamaDart's published
            # native bundle for their platform and architecture.
            sed -i.bak '/llamadart_native_path:/d' pubspec.yaml
            rm -f pubspec.yaml.bak
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release artifact
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: naza-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
